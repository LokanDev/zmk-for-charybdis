# === Базовое включение Bluetooth ===
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# === Поддержка сплит-клавиатуры ===
CONFIG_ZMK_SPLIT=y
# Для беспроводной связи половинок
CONFIG_ZMK_SPLIT_BLE=y
# Количество подключаемых периферийных устройств (обычно 1 вторая половина)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# === Поддержка мыши (для трекбола) ===
CONFIG_ZMK_MOUSE=y

# === Управление питанием ===
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# === Отключение внешнего питания (исправление для Charybdis) ===
CONFIG_ZMK_EXT_POWER=n

# === Отключение необходимости пинкода ===
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
